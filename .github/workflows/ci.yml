name: CI

# Runs on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Check 1: ESLint ───────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Check 2: TypeScript ───────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

  # ── Check 3: Production build ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build)
        # Firebase/R2 clients initialize lazily at runtime, so the build needs
        # no real secrets. Placeholder public values keep the build realistic
        # and prevent any accidental build-time env access from failing.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
        run: npm run build

      - name: Bundle budget (first-load JS per route)
        # Reads the build output above, so no second build. Fails when a
        # public page grows or an admin page passes its budget.
        run: npm run check:bundle

  # ── Check 4: Dependency audit (blocks on high/critical) ───────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fails on high or critical)
        # Moderate advisories are reported but do not fail the check.
        # High or critical ones fail it: fix them, or add a reviewed
        # `overrides` entry in package.json.
        run: npm audit --audit-level=high

  # ── Check 5: Unit tests (Vitest, node + jsdom) ────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest (unit + unit-dom)
        run: npm run test:unit

  # ── Check 6: Integration tests (route handlers, later the emulator) ──────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Firestore emulator is a Java program. firebase-tools 15 needs JDK 21+.
      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Emulator jars download on first run; cache them per firebase-tools version.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.36.0

      # Starts the Firestore + Auth emulators (project demo-syncflow, never a
      # real project), runs the integration suite, then stops them. The
      # REQUIRE flag makes an emulator suite fail instead of skip if the
      # emulator did not start.
      - name: Vitest (integration, on the Firestore emulator)
        env:
          REQUIRE_FIRESTORE_EMULATOR: '1'
        run: npm run test:integration:emulator

  # ── Check 7: End-to-end (Playwright, 8 viewports, Chromium) ───────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build (next build)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
        run: npm run build

      - name: Playwright
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Check 8: Signed-in admin e2e on the Firebase emulators ────────────────
  # The admin specs need real `__session` cookies. This job starts the
  # Firestore + Auth emulators (project demo-syncflow, never a real project),
  # seeds users with role claims plus the docs the screens read, mints one
  # session cookie per role into E2E_* env vars, and runs the admin specs and
  # the click-privacy "real room" case against a server on the emulators.
  # The `e2e` job above keeps running everything without Firebase.
  e2e-signed-in:
    name: E2E Tests (signed in, emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Firestore emulator is a Java program. firebase-tools 15 needs JDK 21+.
      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Emulator jars download on first run; cache them per firebase-tools version.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.36.0

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The browser reads chat messages straight from Firestore, so this build
      # points the client SDK at the emulator (NEXT_PUBLIC_*, inlined at build
      # time; never set for a deployed build) on the emulator's project id.
      - name: Build (next build, client on the Firestore emulator)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-syncflow
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
          NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npm run build

      # Same firebase-tools version, emulators and project as
      # `npm run test:integration:emulator`, but `emulators:start` in the
      # background so the seed and Playwright steps can share them.
      - name: Start Firestore + Auth emulators
        run: |
          nohup npx --yes firebase-tools@15.36.0 emulators:start --only firestore,auth --project demo-syncflow \
            > emulators.log 2>&1 &

      # Waits for both emulators, seeds users (role claims), settings, roles
      # index, a block, a chat room and analytics sessions, then appends the
      # session cookies and ids to $GITHUB_ENV:
      # E2E_ADMIN_SESSION, E2E_ADMIN_UID, E2E_MODERATOR_SESSION,
      # E2E_VIEWER_SESSION, E2E_NOROLE_SESSION, E2E_CHAT_ROOM, E2E_SUBJECT_IP.
      # Hosts must match firebase.json "emulators". Set only on the steps that
      # talk to the emulators (not on the build).
      - name: Seed emulators and mint session cookies
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: node tests/e2e/support/seed-emulator.mjs

      # E2E_REQUIRE_SESSIONS: playwright.config.ts refuses to start when a
      # seeded E2E_* var is missing, so signed-in specs cannot skip silently.
      # The server (`next start`, started by Playwright) inherits the emulator
      # hosts, so admin.ts starts the Admin SDK with no credentials on
      # project demo-syncflow and verifies the seeded session cookies.
      - name: Playwright (admin + click privacy, signed in)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          E2E_REQUIRE_SESSIONS: '1'
        run: npm run test:e2e -- tests/e2e/admin tests/e2e/public/click-privacy.spec.ts

      - name: Upload report and emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-signed-in
          path: |
            playwright-report/
            emulators.log
          retention-days: 7

  # ── Aggregate gate: one required check that summarizes the rest ────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, audit, unit, integration, e2e, e2e-signed-in]
    if: always()
    steps:
      - name: Verify required checks passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.e2e-signed-in.result }}" != "success" ]; then
            echo "One or more required checks failed:"
            echo "  lint=${{ needs.lint.result }}"
            echo "  typecheck=${{ needs.typecheck.result }}"
            echo "  build=${{ needs.build.result }}"
            echo "  audit=${{ needs.audit.result }}"
            echo "  unit=${{ needs.unit.result }}"
            echo "  integration=${{ needs.integration.result }}"
            echo "  e2e=${{ needs.e2e.result }}"
            echo "  e2e-signed-in=${{ needs.e2e-signed-in.result }}"
            exit 1
          fi
          echo "All required checks passed."
